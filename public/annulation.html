<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiement annulé</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f6f7f9;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    padding: 40px 32px;
    max-width: 420px;
    width: 90%;
    text-align: center;
  }
  .icone {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #fdeeee;
    color: #d1242f;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; color: #1a1a1a; }
  p { color: #666; font-size: 14px; margin: 0 0 20px; }
  a {
    display: inline-block;
    padding: 10px 20px;
    background: #635bff;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icone">✕</div>
    <h1>Paiement annulé</h1>
    <p>Ton paiement n'a pas été effectué. Tu peux réessayer quand tu veux.</p>
    <a href="/">Retour à l'inscription</a>
  </div>
</body>
</html>
